<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>신학 문답</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" />
<style>
  :root {
    --serif: "Gowun Batang", "Nanum Myeongjo", serif;
    --sans: "Noto Sans KR", "Figtree", system-ui, sans-serif;

    --color-bg: #f5ead8;
    --color-surface: #fffdf7;
    --color-text: #3a352f;
    --color-divider: rgba(58,53,47,.12);
    --soft: rgba(58,53,47,.06);
    --ink-70: rgba(58,53,47,.72);
    --ink-55: rgba(58,53,47,.55);
    --ink-40: rgba(58,53,47,.4);
    --c-worry: #6d7f52; --c-worry-tint: #eef4e2; --c-worry-soft: #f6f9ef;
    --c-life:  #b3703f; --c-life-tint:  #fbeade; --c-life-soft:  #fdf3ec;
    --c-doc:   #8a7350; --c-doc-tint:   #f2ece0; --c-doc-soft:   #f9f5ec;
    --on-cat: #fffdf8;
    --av-bg: #f0e7d5;
    --shadow-soft: 0 1px 2px rgba(58,53,47,.05), 0 6px 18px rgba(58,53,47,.05);

    /* 선택된 갈래 색 (JS가 갱신) */
    --cat: var(--c-worry);
    --cat-tint: var(--c-worry-tint);
    --cat-soft: var(--c-worry-soft);
  }
  :root.dark {
    --color-bg: #2f2b26;
    --color-surface: #272420;
    --color-text: #f6f1e7;
    --color-divider: rgba(246,241,231,.18);
    --soft: rgba(246,241,231,.08);
    --ink-70: rgba(246,241,231,.78);
    --ink-55: rgba(246,241,231,.62);
    --ink-40: rgba(246,241,231,.46);
    --c-worry: #c3d3a6; --c-worry-tint: #4b5340; --c-worry-soft: #464e3c;
    --c-life:  #eeb083; --c-life-tint:  #5a4636; --c-life-soft:  #524032;
    --c-doc:   #dfcba4; --c-doc-tint:   #544a3a; --c-doc-soft:   #4d4436;
    --on-cat: #2e2a25;
    --av-bg: #524a40;
    --shadow-soft: 0 1px 2px rgba(0,0,0,.22), 0 6px 18px rgba(0,0,0,.18);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  button { font: inherit; }
  .hover-soft:hover { background: var(--soft) !important; }
  .hover-op:hover { opacity: .85; }
  .pill-cat { transition: background .18s ease, border-color .18s ease; }
  .pill-cat:hover { border-color: var(--pc) !important; }
  .example-chip { transition: background .18s ease; }
  .example-chip:hover { background: var(--cat-tint) !important; }
  a { color: var(--c-life); }

  :focus-visible { outline: 2px solid var(--cat); outline-offset: 2px; border-radius: 6px; }

  .hidden { display: none !important; }

  @media (max-width: 720px) {
    aside.rail { position: static !important; top: auto !important; }
  }
</style>
</head>
<body>
<div style="min-height:100vh;background:var(--color-bg);color:var(--color-text);padding:clamp(20px,4vw,44px) clamp(16px,4vw,40px) 90px;font-family:var(--sans);line-height:1.7">
  <div style="max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:30px">

    <!-- HEADER -->
    <header style="display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;border-bottom:1px solid var(--color-divider);padding-bottom:22px">
      <div style="display:flex;align-items:center;gap:16px">
        <svg viewBox="0 0 64 64" style="width:54px;height:54px;flex:none" aria-hidden="true">
          <circle cx="32" cy="32" r="30" fill="var(--cat-tint)"></circle>
          <circle cx="32" cy="32" r="21" fill="none" stroke="var(--cat)" stroke-width="1" opacity=".45"></circle>
          <path d="M32 13 V51 M21 26 H43" fill="none" stroke="var(--cat)" stroke-width="3" stroke-linecap="round"></path>
        </svg>
        <div style="display:flex;flex-direction:column;gap:9px">
          <span style="display:inline-flex;align-items:center;gap:7px;padding:4px 12px;border-radius:999px;font-size:11px;letter-spacing:.04em;font-weight:700;background:var(--c-life-tint);color:var(--c-life);width:fit-content">
            <span style="width:5px;height:5px;border-radius:50%;background:currentColor;display:block"></span>프로토타입 · 예시 답변
          </span>
          <h1 style="margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(27px,3.6vw,38px);line-height:1.25;letter-spacing:-.02em">신학 문답</h1>
        </div>
      </div>
      <div style="display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap">
        <p style="margin:0;max-width:42ch;font-size:14px;line-height:1.75;color:var(--ink-55)">
          질문 하나를 두고 역사 속 신학자들이 각자의 자리에서 답합니다. 실제 생성 결과가 아닌, 미리 준비된 예시 화면입니다.
        </p>
        <button id="themeBtn" class="hover-soft" style="cursor:pointer;font-size:12px;color:var(--ink-70);background:transparent;border:1px solid var(--color-divider);border-radius:999px;padding:6px 14px;white-space:nowrap;transition:background .18s ease">밝게 보기</button>
      </div>
    </header>

    <!-- BODY -->
    <div style="display:flex;flex-wrap:wrap;gap:clamp(20px,3vw,34px);align-items:flex-start">

      <!-- LEFT RAIL -->
      <aside class="rail" style="flex:0 1 268px;min-width:250px;position:sticky;top:20px;display:flex;flex-direction:column;gap:22px">
        <div style="display:flex;flex-direction:column;gap:11px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:20px;padding:16px 15px;box-shadow:var(--shadow-soft)">
          <span style="font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--ink-40)">답하는 신학자</span>
          <div id="roster" style="display:flex;flex-direction:column;gap:9px"></div>
        </div>
      </aside>

      <!-- MAIN -->
      <main style="flex:1 1 520px;min-width:300px;display:flex;flex-direction:column;gap:30px">

        <!-- ASK -->
        <section style="display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <span style="font-size:10.5px;letter-spacing:.14em;font-weight:700;color:var(--ink-40);margin-right:2px">갈래</span>
            <div id="pills" style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"></div>
          </div>

          <div style="background:var(--color-surface);border:1px solid var(--color-divider);border-radius:24px;padding:20px 20px 15px;box-shadow:var(--shadow-soft);display:flex;flex-direction:column;gap:12px">
            <div style="display:flex;align-items:center;gap:9px">
              <span id="qCatName" style="display:inline-flex;align-items:center;padding:4px 12px;border-radius:999px;font-family:var(--serif);font-weight:700;font-size:13px;background:var(--cat-tint);color:var(--cat)"></span>
              <span style="font-size:12px;color:var(--ink-40)">에 대해 묻는 중</span>
            </div>
            <textarea id="draft" rows="3" placeholder="마음에 걸리는 질문을 그대로 적어 주세요" style="width:100%;resize:none;font-family:var(--sans);font-size:16px;line-height:1.75;color:var(--color-text);background:transparent;border:0;outline:none;padding:2px 2px 6px"></textarea>
            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--color-divider);padding-top:12px">
              <span style="font-size:11.5px;color:var(--ink-40)">Enter 로 보내기 · Shift + Enter 로 줄바꿈</span>
              <button id="submitBtn" class="hover-op" style="margin-left:auto;cursor:pointer;font-family:var(--sans);font-weight:700;font-size:13.5px;color:var(--on-cat);background:var(--cat);border:0;border-radius:999px;padding:9px 22px;transition:opacity .18s ease">묻기</button>
            </div>
          </div>

          <div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding-left:4px">
            <span style="font-size:11.5px;color:var(--ink-40);flex:none">예시</span>
            <button id="exampleChip" class="example-chip" style="cursor:pointer;font-size:12.5px;text-align:left;padding:6px 14px;border-radius:999px;background:transparent;color:var(--ink-70);border:1px dashed var(--color-divider)"></button>
          </div>
        </section>

        <!-- RESULTS -->
        <div id="results" class="hidden"></div>

        <!-- FOOTER -->
        <footer style="border-top:1px solid var(--color-divider);padding-top:18px;display:flex;flex-direction:column;gap:7px">
          <p style="margin:0;font-size:12px;line-height:1.75;color:var(--ink-55)">
            이 서비스는 전문적인 목회 상담이나 위기 상황에서의 도움을 대체하지 않습니다. 지금 위태로운 마음에 있다면 가까운 목회자·상담 전문가 또는 지역 위기 상담 창구에 연락해 주세요.
          </p>
          <p style="margin:0;font-size:11px;color:var(--ink-40)">모든 답변은 예시로 준비된 프로토타입 콘텐츠입니다.</p>
        </footer>

      </main>
    </div>
  </div>
</div>

<script>

    example: "요즘 모든 것이 허무하게 느껴지고, 삶에 의미가 있는지 모르겠습니다.",

    verses: [
      { ref: "요한복음 10:28–29", text: "내가 그들에게 영생을 주노니 영원히 멸망하지 아니할 것이요.", note: "보존을 하나님의 붙드심에 두는 본문. 입장 A가 가장 무겁게 인용합니다." },
      { ref: "히브리서 6:4–6", text: "한 번 빛을 받고 하늘의 은사를 맛보고… 타락한 자들은 다시 새롭게 하여 회개하게 할 수 없나니.", note: "경고 본문의 대표. 입장 B는 실제 가능성으로, A는 가정적 경고로 읽습니다." },
      { ref: "빌립보서 2:12–13", text: "두렵고 떨림으로 너희 구원을 이루라. 너희 안에서 행하시는 이는 하나님이시니.", note: "책임과 하나님의 사역이 한 문장에 있습니다. 세 입장 모두 자기 근거로 삼습니다." }
    ],
    figures: [
      { name: "사울 왕", ref: "사무엘상", av: BAV.saul,
        note: "기름 부음을 받고 하나님의 영이 임했으나 끝내 버림받은 왕입니다. '은총의 상태에서 떨어질 수 있는가'라는 물음에서 배교 가능성(입장 B)의 사례로 자주 인용됩니다." },
      { name: "가룟 유다", ref: "복음서", av: BAV.judas,
        note: "열두 제자 중 하나였으나 스승을 팔고 멸망했습니다. 그가 '참된 신자였다가 떨어진 것'인지 '처음부터 택함받지 못한 자'였는지에서 입장 A와 B가 정면으로 갈립니다." },
      { name: "베드로", ref: "복음서", av: BAV.peter,
        note: "주를 세 번 부인한 실패 후에도 회복되어 복권되었습니다. '일시적 실패'와 '최종적 배교'를 구분하는 논의에서, 견인(입장 A)의 사례로 인용됩니다." }
    ]
  }
};

const ORDER = ["worry", "life", "doctrine"];
const CATVARS = {
  worry:    ["var(--c-worry)", "var(--c-worry-tint)", "var(--c-worry-soft)"],
  life:     ["var(--c-life)",  "var(--c-life-tint)",  "var(--c-life-soft)"],
  doctrine: ["var(--c-doc)",   "var(--c-doc-tint)",   "var(--c-doc-soft)"]
};

/* ---- 상태 ---- */
const state = { cat: "worry", submitted: false, dark: true };

const root = document.documentElement;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---- 아바타 SVG ---- */
function avatar(av, size, withFace) {
  const eyes = withFace
    ? `<circle cx="27" cy="28" r="1.3" fill="#4a423a"></circle><circle cx="37" cy="28" r="1.3" fill="#4a423a"></circle>`
    : "";
  const glasses = withFace
    ? `<g fill="none" stroke="#5d544a" stroke-width="1.4" opacity="${av.glasses ? 1 : 0}"><circle cx="27" cy="28" r="4.2"></circle><circle cx="37" cy="28" r="4.2"></circle><path d="M31.2 28 h1.6"></path></g>`
    : "";
  const mt = withFace ? "margin-top:2px;" : "";
  return `<svg viewBox="0 0 64 64" style="width:${size}px;height:${size}px;flex:none;border-radius:50%;background:var(--av-bg);${mt}">
    <path d="M4 64 q6-19 28-19 t28 19 Z" fill="${av.robe}"></path>
    <ellipse cx="32" cy="28" rx="12.5" ry="14.5" fill="${av.skin}"></ellipse>
    ${eyes}
    <path d="${av.hairD}" fill="${av.hair}"></path>
    <path d="${av.beardD}" fill="${av.hair}"></path>
    ${glasses}
  </svg>`;
}

/* ---- 갈래 반영 ---- */
function applyCat() {
  const [c, t, s] = CATVARS[state.cat];
  root.style.setProperty("--cat", c);
  root.style.setProperty("--cat-tint", t);
  root.style.setProperty("--cat-soft", s);

  const d = DATA[state.cat];

  // 좌측 신학자 명단
  $("roster").innerHTML = d.panel.map(r => `
    <div style="display:flex;align-items:center;gap:10px">
      ${avatar(r.av, 30, false)}
      <span style="display:flex;flex-direction:column;min-width:0">
        <span style="font-family:var(--serif);font-size:13.5px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</span>
        <span style="font-size:10.5px;color:var(--ink-40)">${esc(r.years)}</span>
      </span>
    </div>`).join("");

  // 갈래 pill
  $("pills").innerHTML = ORDER.map(k => {
    const dd = DATA[k], on = k === state.cat, pc = CATVARS[k][0], pt = CATVARS[k][1];
    return `<button class="pill-cat" data-k="${k}" style="--pc:${pc};cursor:pointer;text-align:left;color:var(--color-text);background:${on ? pt : "var(--color-surface)"};border:1px solid ${on ? pc : "var(--color-divider)"};border-radius:999px;padding:8px 16px 8px 13px;display:flex;gap:9px;align-items:center">
      <span style="flex:none;width:8px;height:8px;border-radius:50%;background:${pc};opacity:${on ? 1 : .3}"></span>
      <span style="font-family:var(--serif);font-weight:700;font-size:15px;line-height:1.2">${esc(dd.name)}</span>
      <span style="font-size:11.5px;line-height:1.4;color:var(--ink-55);opacity:${on ? 1 : .6}">${esc(dd.desc)}</span>
    </button>`;
  }).join("");

  // 질문 박스 라벨 · 예시 칩
  $("qCatName").textContent = d.name;
  $("exampleChip").textContent = d.example;
}

/* ---- 결과 렌더 ---- */
function renderResults(asked) {
  const d = DATA[state.cat];
  const isDoctrine = state.cat === "doctrine";

  const analysisSec = `
    <section style="animation:riseIn .45s .04s both;background:var(--color-surface);box-shadow:var(--shadow-soft);border:1px solid var(--color-divider);border-radius:24px;padding:22px 24px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:baseline;gap:9px">
        <span style="font-family:var(--serif);font-size:17px;color:var(--cat)">①</span>
        <h2 style="margin:0;font-family:var(--serif);font-weight:700;font-size:18px">질문 분석</h2>
      </div>
      <p style="margin:0;font-size:15px;line-height:1.9;color:var(--ink-70)">${esc(d.analysis)}</p>
      <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:2px">
        ${d.tags.map(t => `<span style="font-size:11.5px;padding:4px 12px;border-radius:999px;background:var(--cat-tint);color:var(--cat);font-weight:500">${esc(t)}</span>`).join("")}
      </div>
    </section>`;

  const panelSec = `
    <section style="animation:riseIn .45s .14s both;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">
        <span style="font-family:var(--serif);font-size:17px;color:var(--cat)">②</span>
        <h2 style="margin:0;font-family:var(--serif);font-weight:700;font-size:18px">신학자별 답변</h2>
        <span style="font-size:11.5px;color:var(--ink-40)">다섯 사람이 같은 질문에 차례로 답합니다</span>
      </div>
      <div style="display:flex;flex-direction:column;gap:10px">
        ${d.panel.map(t => `
          <div style="background:var(--color-surface);border:1px solid var(--color-divider);border-radius:22px;box-shadow:var(--shadow-soft)">
            <div style="padding:16px 20px 18px;display:flex;gap:14px;align-items:flex-start">
              ${avatar(t.av, 46, true)}
              <div style="flex:1;display:flex;flex-direction:column;gap:7px;min-width:0">
                <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap">
                  <span style="font-family:var(--serif);font-weight:700;font-size:16.5px">${esc(t.name)}</span>
                  <span style="font-size:10.5px;color:var(--ink-40)">${esc(t.years)}</span>
                  <span style="font-size:10.5px;padding:2px 9px;border-radius:999px;background:var(--cat-tint);color:var(--cat)">${esc(t.tradition)}</span>
                </div>
                <p style="margin:0;font-family:var(--serif);font-size:14px;line-height:1.6;color:var(--cat)">${esc(t.summary)}</p>
                <p style="margin:0;font-size:14.5px;line-height:1.9;color:var(--ink-70)">${esc(t.body)}</p>
              </div>
            </div>
          </div>`).join("")}
      </div>
      <p style="margin:0;font-size:11.5px;line-height:1.65;color:var(--ink-40)">각 답변은 해당 신학자의 사상에 근거해 재구성한 것이며, 실제 저작의 직접 인용이 아닙니다. 초상은 인물의 특징을 단순화한 일러스트입니다.</p>
    </section>`;

  let conclBody;
  if (!isDoctrine) {
    conclBody = `
      <div style="background:var(--color-surface);border:1px solid var(--color-divider);border-left:4px solid var(--cat);box-shadow:var(--shadow-soft);border-radius:24px;padding:24px 26px;display:flex;flex-direction:column;gap:12px">
        ${d.unified.map(p => `<p style="margin:0;font-size:15px;line-height:1.95">${esc(p)}</p>`).join("")}
      </div>`;
  } else {
    conclBody = `
      <div style="display:flex;flex-direction:column;gap:13px">
        <p style="margin:0;font-size:14px;color:var(--ink-55)">이 물음은 전통에 따라 답이 실제로 갈립니다. 하나로 봉합하는 대신, 누가 어디에 서 있는지 지도로 펼칩니다.</p>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px">
          ${d.positions.map(p => `
            <div style="background:var(--color-surface);border:1px solid var(--color-divider);border-top:3px solid var(--c-doc);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow-soft)">
              <span style="font-size:10.5px;letter-spacing:.1em;font-weight:700;color:var(--c-doc)">${esc(p.label)}</span>
              <span style="font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.4">${esc(p.claim)}</span>
              <span style="font-size:13px;color:var(--ink-55);line-height:1.75">${esc(p.detail)}</span>
              <span style="margin-top:auto;padding-top:9px;border-top:1px solid var(--color-divider);font-family:var(--serif);font-size:12.5px;color:var(--c-doc)">${esc(p.who)}</span>
            </div>`).join("")}
        </div>
        <div style="display:flex;flex-direction:column;gap:7px;background:var(--color-surface);border:1px solid var(--color-divider);border-radius:20px;padding:16px 20px">
          <span style="font-size:10.5px;letter-spacing:.1em;font-weight:700;color:var(--c-doc)">갈림의 축</span>
          ${d.axes.map(ax => `<span style="font-size:13.5px;line-height:1.8;color:var(--ink-70)">· ${esc(ax)}</span>`).join("")}
        </div>
        <p style="margin:0;font-size:12px;line-height:1.75;color:var(--ink-55);border-left:2px solid var(--color-divider);padding-left:12px">
          이 지도는 어느 교단이나 전통을 정통으로 단정하지 않습니다. 각 입장은 그 전통 안에서 오랜 성찰을 거친 것이며, 판단은 독자와 그가 속한 신앙 공동체의 몫으로 남겨 둡니다.
        </p>
      </div>`;
  }

  const conclusionSec = `
    <section style="animation:riseIn .45s .24s both;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:baseline;gap:9px">
        <span style="font-family:var(--serif);font-size:17px;color:var(--cat)">③</span>
        <h2 style="margin:0;font-family:var(--serif);font-weight:700;font-size:18px">${isDoctrine ? "쟁점 지도" : "복합적 결론"}</h2>
      </div>
      ${conclBody}
    </section>`;

  const versesSec = `
    <section style="animation:riseIn .45s .34s both;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:baseline;gap:9px">
        <span style="font-family:var(--serif);font-size:17px;color:var(--cat)">④</span>
        <h2 style="margin:0;font-family:var(--serif);font-weight:700;font-size:18px">참고 성경 구절</h2>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px">
        ${d.verses.map(v => `
          <div style="background:var(--color-surface);border:1px solid var(--color-divider);border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:9px;box-shadow:var(--shadow-soft)">
            <span style="font-family:var(--serif);font-weight:700;font-size:13px;color:var(--cat)">${esc(v.ref)}</span>
            <span style="font-family:var(--serif);font-size:15px;line-height:1.85">${esc(v.text)}</span>
            <span style="font-size:12.5px;line-height:1.75;color:var(--ink-55);border-top:1px solid var(--color-divider);padding-top:9px">${esc(v.note)}</span>
          </div>`).join("")}
      </div>
    </section>`;

  const figuresTitle = isDoctrine ? "질문과 관련된 성경 인물" : "비슷한 고민을 했던 성경 속 인물";
  const figuresHint = isDoctrine ? "이 물음을 논할 때 성경이 실제로 거론하는 사람들입니다" : "성경 속에서도 같은 자리를 지나간 사람들이 있습니다";
  const figuresSec = `
    <section style="animation:riseIn .45s .44s both;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:baseline;gap:9px;flex-wrap:wrap">
        <span style="font-family:var(--serif);font-size:17px;color:var(--cat)">⑤</span>
        <h2 style="margin:0;font-family:var(--serif);font-weight:700;font-size:18px">${figuresTitle}</h2>
        <span style="font-size:11.5px;color:var(--ink-40)">${figuresHint}</span>
      </div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px">
        ${d.figures.map(f => `
          <div style="background:var(--color-surface);border:1px solid var(--color-divider);border-radius:22px;padding:18px 20px;display:flex;flex-direction:column;gap:11px;box-shadow:var(--shadow-soft)">
            <div style="display:flex;gap:12px;align-items:center">
              ${avatar(f.av, 42, true)}
              <span style="display:flex;flex-direction:column;gap:2px;min-width:0">
                <span style="font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.3">${esc(f.name)}</span>
                <span style="font-size:11px;color:var(--cat)">${esc(f.ref)}</span>
              </span>
            </div>
            <p style="margin:0;font-size:13.5px;line-height:1.85;color:var(--ink-70)">${esc(f.note)}</p>
          </div>`).join("")}
      </div>
      <p style="margin:0;font-size:11.5px;line-height:1.65;color:var(--ink-40)">초상은 인물의 특징을 단순화한 일러스트이며 실제 모습이 아닙니다.</p>
    </section>`;

  const stickyBar = `
    <div style="position:sticky;top:0;z-index:6;margin:-8px 0 -14px;padding:12px 0;background:var(--color-bg);border-bottom:1px solid var(--color-divider);display:flex;gap:10px;align-items:flex-start">
      <span style="flex:none;margin-top:2px;font-size:10.5px;font-family:var(--serif);font-weight:700;padding:3px 10px;border-radius:999px;background:var(--cat-tint);color:var(--cat)">${esc(d.name)}</span>
      <span style="font-size:13.5px;line-height:1.6;color:var(--ink-70);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${esc(asked)}</span>
    </div>`;

  const reask = `
    <div style="display:flex;gap:10px;flex-wrap:wrap;animation:fadeIn .5s .45s both">
      <button id="reaskBtn" class="hover-soft" style="cursor:pointer;font-size:13px;color:var(--color-text);background:transparent;border:1px solid var(--color-divider);border-radius:999px;padding:9px 18px">질문 지우고 다시 묻기</button>
    </div>`;

  $("results").innerHTML = `<div style="display:flex;flex-direction:column;gap:34px">${stickyBar}${analysisSec}${panelSec}${conclusionSec}${versesSec}${figuresSec}${reask}</div>`;
  $("results").classList.remove("hidden");

  $("reaskBtn").addEventListener("click", () => {
    state.submitted = false;
    $("draft").value = "";
    $("results").classList.add("hidden");
    $("results").innerHTML = "";
    $("draft").focus();
  });
}

/* ---- 동작 ---- */
function submit() {
  const d = DATA[state.cat];
  const text = ($("draft").value || "").trim() || d.example;
  $("draft").value = text;
  state.submitted = true;
  renderResults(text);
  $("results").scrollIntoView({ behavior: "smooth", block: "start" });
}

function pick(k) {
  state.cat = k;
  state.submitted = false;
  $("draft").value = "";
  $("results").classList.add("hidden");
  $("results").innerHTML = "";
  applyCat();
}

function applyTheme() {
  root.classList.toggle("dark", state.dark);
  $("themeBtn").textContent = state.dark ? "밝게 보기" : "어둡게 보기";
}

/* ---- 이벤트 바인딩 ---- */
$("pills").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-k]");
  if (btn) pick(btn.dataset.k);
});
$("submitBtn").addEventListener("click", submit);
$("draft").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
});
$("exampleChip").addEventListener("click", () => {
  $("draft").value = DATA[state.cat].example;
  $("draft").focus();
});
$("themeBtn").addEventListener("click", () => {
  state.dark = !state.dark;
  applyTheme();
});

/* ---- 초기화 (다크 기본) ---- */
applyTheme();
applyCat();
</script>
</body>
</html>
